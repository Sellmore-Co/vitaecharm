<style>
#selector-tabs {
  display:flex;
  width:100%;
  gap:20px;
  justify-content:space-between;
}

#selector-tabs a{
  display:flex;
  text-align:center;
  flex:1 1 0%;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:9px 10px;          /* UPDATED */
  font-size:16px;            /* UPDATED */
  line-height:24px;
  font-weight:bold;
  border:2px solid rgb(195, 207, 217);
  border-radius:16px;
  position:relative;
  text-decoration:none;
  color:#222;
  box-sizing:border-box;
}

/* top image */
#selector-tabs a .opt-img{
  width:64px;
  height:64px;
  object-fit:contain;
  display:block;
  margin:0 0 8px;
}

/* title */
#selector-tabs a strong{
  font-weight:700;
  display:block;
}

/* base subtext */
#selector-tabs a .sub{
  display:block;
  font-size:14px;
  font-weight:400;
  color:#666;
  margin-top:4px;
}

/* price row: NO custom color now (inherits from .sub) */
#selector-tabs a .sub.price{
  text-transform:none;
}

/* old price */
#selector-tabs a .sub.price .was{
  text-decoration:line-through;
  color:#777;
}

/* new price in red */
#selector-tabs a .sub.price .now{
  color:#E93323;
}



/* total */
#selector-tabs a .sub.total{
  margin-top:2px;
  color:#666;
  text-transform:none;
}

/* badge base */
#selector-tabs a i{
  position:absolute;
  top:-10px;
  left:50%;
  transform:translateX(-50%);
  background:#E93323;
  color:#fff;
  font-style:normal;
  font-weight:400;
  font-size:11px;
  line-height:18px;
  text-transform:uppercase;
  padding:0px 7px;
  border-radius:20px;
  white-space:nowrap;
}

/* Badge colors */
#selector-tabs a.badge-popular i{
  background:#F5BB41;
  color:#222;
}
#selector-tabs a.badge-value i{
  background:#E93323;
  color:#fff;
}

#selector-tabs a.active {
  border-color:#456ede;
  background:rgb(243, 246, 253);
}

/* FREE GIFTS (UNCHANGED styles) */
#free-gifts{
  margin:20px 20px 0;
  background:#fff;
}

.free-gifts__title{
  text-align:center;
  font-size:16px;
  line-height:20px;
  font-weight:bold;
  margin-bottom:14px;
  position:relative;
}
.free-gifts__title:after {
  position:absolute;
  content:"";
  top:50%;
  left:0;
  height:1px;
  background:#C4CED8;
  width:100%;
  z-index:1;
}
.free-gifts__title span{
  font-weight:900;
  background:#fff;
  display:inline-block;
  padding:0 15px;
  position:relative;
  z-index:2;
}

.free-gifts__grid{
  display:flex;
  justify-content:center;
  gap:clamp(10px, 4vw, 40px);
  width:100%;
  margin:0 auto;
  flex-wrap:nowrap;
}

.gift{
  flex:0 1 110px;
  max-width:110px;
  min-width:82px;
  text-align:center;
}

.gift__price{
  width:max-content;
  margin:0 auto -10px;
  background:#456EDE;
  color:#fff;
  border-radius:999px;
  padding:0px 10px;
  font-size:11px;
  line-height:18px;
  position:relative;
  z-index:2;
}
.gift__price span {text-decoration:line-through;}

.gift__media{
  width:100%;
  aspect-ratio:1/1;
  border-radius:14px;
  overflow:hidden;
  position:relative;
  background:#000;
}

.gift__media img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition: opacity .25s ease, filter .25s ease;
}

.gift__lock{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:6px;
  background:rgba(245,245,245,.75);
  transition: opacity .25s ease;
}

.gift__lock-icon{ font-size:26px; }
.gift__lock-text{
  font-size:14px;
  font-weight:bold;
  color:#444;
}

.gift__name{
  margin-top:10px;
  font-size:14px;
  line-height:1.1;
  font-weight:normal;
}

/* LOCKED */
#free-gifts.is-locked .gift{
  opacity:.85;
  filter:saturate(.7);
}
#free-gifts.is-locked .gift__media{
  background:#eee;
}
#free-gifts.is-locked .gift__media img{
  opacity:0;
  filter: none;
}
#free-gifts.is-locked .gift__lock{
  opacity:1;
  filter: grayscale(1);
}
#free-gifts.is-locked .gift__price{
  background:#B8C0CC;
}

/* UNLOCKED */
#free-gifts.is-unlocked .gift__media img{
  opacity:1;
  filter:none;
}
#free-gifts.is-unlocked .gift__lock{
  opacity:0;
  pointer-events:none;
}

@media (max-width: 768px) {
  #selector-tabs{
    gap:8px;
    overflow-x:visible;
    padding-bottom:0;
  }

  #selector-tabs a{
    flex:1 1 0%;
    min-width:0;
    padding:10px 8px;
    font-size:14px;
    line-height:18px;
    border-radius:14px;
  }

  #selector-tabs a .opt-img{
    width:44px;
    height:44px;
    margin-bottom:6px;
  }

  #selector-tabs a .sub{
    font-size:11px;
    margin-top:3px;
  }

  #selector-tabs a .sub.total{
    margin-top:1px;
  }

  #selector-tabs a i{
    font-size:11px;
    line-height:14px;
    padding:0 7px;
    top:-8px;
  }

  .free-gifts__title{
    font-size:12px;
  }
}

@media (max-width: 360px) {
  #selector-tabs{ gap:6px; }
  #selector-tabs a{
    padding:9px 6px;
    font-size:13px;
  }
  #selector-tabs a .opt-img{
    width:40px;
    height:40px;
  }
  #selector-tabs a .sub{
    font-size:10px;
  }
}
</style>
