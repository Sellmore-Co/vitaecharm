<div data-next-catalog-component="express-checkout" data-next-express-checkout="container" class="exp-checkout">
  {% if show_title != false %}
  <div class="express-checkout__title">Express checkout</div>
  {% endif %}
  <div data-next-component="express-error" class="next-toast-handler">
    <div class="tip1_bar is-warning">
      <div data-next-component="express-error-text" class="text-sm">Error message</div>
    </div>
  </div>
  <!-- Buttons are injected by campaign-cart ExpressCheckoutContainerEnhancer -->
  <div data-next-express-checkout="buttons" class="express-checkout__buttons"></div>
  <!-- Future-charges disclaimer under the express buttons (Shopify parity —
       merchant feedback round 5). The longer subscription disclosure under the
       Pay-now button is intentionally kept as well. -->
  <div class="submit-section__disclaimer express-checkout__disclaimer">By continuing with your payment, you agree to the future charges listed on this page and the <a href="{{ campaign.store_cancellations }}" target="_blank" rel="noopener noreferrer" data-modal-target="#policy-cancellations" class="submit-section__policy-link next-page-modal__trigger">cancellation policy</a>.</div>
  {% if show_divider != false %}
  <div class="divider-section">
    <div class="divider-section__line-v2"></div>
    <div class="divider-section__text-v2">OR</div>
    <div class="divider-section__line-v2"></div>
  </div>
  {% endif %}
</div>
