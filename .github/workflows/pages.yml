name: Deploy to GitHub Pages

# Builds the static campaign (npm run build -> _site/) and deploys it to
# GitHub Pages, served at the custom domain buy.vitaecharm.com.
#
# Pages cannot run worker.js, so this workflow reproduces its two behaviours
# as static files written into _site/ after the build:
#   - CNAME       : binds the custom domain buy.vitaecharm.com
#   - index.html  : redirects the bare "/" to https://vitaecharm.com/
#                   (worker.js does this with a 302; static uses meta-refresh)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for the same branch.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build campaign
        run: npm run build

      - name: Add custom domain + root redirect
        run: |
          echo "buy.vitaecharm.com" > _site/CNAME
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=https://vitaecharm.com/">
              <link rel="canonical" href="https://vitaecharm.com/">
              <title>Redirecting…</title>
            </head>
            <body>
              <p>Redirecting to <a href="https://vitaecharm.com/">vitaecharm.com</a>…</p>
            </body>
          </html>
          HTML

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
