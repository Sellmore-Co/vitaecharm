<!-- Policy links open on-page modals (policy-modals.html) via the generic
     next-page-modal component in checkout.js, which preventDefaults the click.
     The store hrefs are kept as a no-JS fallback. -->
<div class="checkout-footer-links">
  <a href="{{ campaign.store_returns }}" target="_blank" data-modal-target="#policy-refund" class="link next-page-modal__trigger">
    <div>Refund policy</div>
  </a>
  <a href="{{ campaign.store_shipping }}" target="_blank" data-modal-target="#policy-shipping" class="link next-page-modal__trigger">
    <div>Shipping</div>
  </a>
  <a href="{{ campaign.store_privacy }}" target="_blank" data-modal-target="#policy-privacy" class="link next-page-modal__trigger">
    <div>Privacy policy</div>
  </a>
  <a href="{{ campaign.store_terms }}" target="_blank" data-modal-target="#policy-terms" class="link next-page-modal__trigger">
    <div>Terms of service</div>
  </a>
  <a href="{{ campaign.store_cancellations }}" target="_blank" data-modal-target="#policy-cancellations" class="link next-page-modal__trigger">
    <div>Cancellations</div>
  </a>
</div>
